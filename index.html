<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Brain & Fun Zone 🚀</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2C3E50;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .nav-buttons {
            margin-bottom: 30px;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #45b7d1;
        }

        button.active {
            background-color: var(--primary);
        }

        /* Section Styles */
        .section {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }

        .section.active {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Memory Game Styles */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--accent);
            height: 100px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card.flipped {
            background-color: white;
            transform: rotateY(180deg);
        }

        /* Mind Task Styles */
        #color-word {
            font-size: 4em;
            font-weight: bold;
            margin: 40px 0;
            text-transform: uppercase;
        }

        .color-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .color-btn {
            padding: 15px 25px;
            font-size: 1.2em;
            border-radius: 10px;
            background-color: #ecf0f1;
            color: #333;
        }

        #task-score {
            font-size: 1.5em;
            color: var(--primary);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🚀 Kids Brain & Fun Zone 🎮</h1>

    <div class="nav-buttons">
        <button id="btn-game" class="active" onclick="showSection('game')">🎮 Simple Game</button>
        <button id="btn-task" onclick="showSection('task')">🧠 Mind Blowing Task</button>
    </div>

    <!-- Section 1: Simple Game (Memory Match) -->
    <div id="game-section" class="section active">
        <h2>Emoji Memory Match 🕵️‍♂️</h2>
        <p>एक जैसे दो इमोजी ढूँढो! (Find the matching pairs)</p>
        <div class="grid" id="memory-grid"></div>
        <button onclick="initMemoryGame()" style="margin-top: 20px; font-size: 1em; padding: 10px 20px;">🔄 Restart Game</button>
    </div>

    <!-- Section 2: Mind Task (Stroop Effect) -->
    <div id="task-section" class="section">
        <h2>Brain Teaser: Color Confusion 🤯</h2>
        <p><strong>नियम:</strong> जो रंग <em>दिख</em> रहा है उस पर क्लिक करें, शब्द को <em>पढ़ें</em> नहीं!</p>
        <div id="color-word">लाल</div>
        <div class="color-options" id="color-options">
            <!-- Buttons will be generated by JS -->
        </div>
        <div id="task-score">Score: 0</div>
    </div>

    <script>
        // --- Navigation Logic ---
        function showSection(sectionName) {
            document.getElementById('game-section').classList.remove('active');
            document.getElementById('task-section').classList.remove('active');
            document.getElementById('btn-game').classList.remove('active');
            document.getElementById('btn-task').classList.remove('active');

            if(sectionName === 'game') {
                document.getElementById('game-section').classList.add('active');
                document.getElementById('btn-game').classList.add('active');
                initMemoryGame();
            } else {
                document.getElementById('task-section').classList.add('active');
                document.getElementById('btn-task').classList.add('active');
                initMindTask();
            }
        }

        // --- Game 1: Memory Match Logic ---
        const emojis = ['🐶', '🐱', '🐼', '🦊', '🦁', '🐸', '🐶', '🐱', '🐼', '🦊', '🦁', '🐸'];
        let flippedCards = [];
        let matchedPairs = 0;

        function initMemoryGame() {
            const grid = document.getElementById('memory-grid');
            grid.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            
            // Shuffle array
            let shuffled = emojis.sort(() => 0.5 - Math.random());

            shuffled.forEach((emoji, index) => {
                let card = document.createElement('div');
                card.className = 'card';
                card.dataset.emoji = emoji;
                card.dataset.index = index;
                card.innerHTML = '❓';
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
                card.classList.add('flipped');
                card.innerHTML = card.dataset.emoji;
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    setTimeout(checkMatch, 800);
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.dataset.emoji === card2.dataset.emoji) {
                // Match found
                matchedPairs++;
                if (matchedPairs === 6) {
                    alert('🎉 बधाई हो! तुमने गेम जीत लिया! 🎉');
                }
            } else {
                // No match
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                card1.innerHTML = '❓';
                card2.innerHTML = '❓';
            }
            flippedCards = [];
        }

        // --- Game 2: Mind Task Logic (Stroop Effect) ---
        const colors = [
            { name: 'लाल (Red)', hex: 'red' },
            { name: 'नीला (Blue)', hex: 'blue' },
            { name: 'हरा (Green)', hex: 'green' },
            { name: 'पीला (Yellow)', hex: '#F1C40F' },
            { name: 'काला (Black)', hex: 'black' }
        ];
        
        let currentTargetColorHex = '';
        let taskScore = 0;

        function initMindTask() {
            taskScore = 0;
            updateScore();
            nextTaskRound();
            generateColorButtons();
        }

        function nextTaskRound() {
            const wordObj = colors[Math.floor(Math.random() * colors.length)];
            const colorObj = colors[Math.floor(Math.random() * colors.length)];
            
            const wordElement = document.getElementById('color-word');
            wordElement.innerText = wordObj.name.split(' ')[0]; // Show Hindi word
            wordElement.style.color = colorObj.hex; // Paint it with random color
            
            currentTargetColorHex = colorObj.hex; // Player must pick this color
        }

        function generateColorButtons() {
            const optionsDiv = document.getElementById('color-options');
            optionsDiv.innerHTML = '';
            
            colors.forEach(color => {
                let btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.innerText = color.name;
                btn.onclick = () => checkMindTaskAnswer(color.hex);
                optionsDiv.appendChild(btn);
            });
        }

        function checkMindTaskAnswer(selectedHex) {
            if (selectedHex === currentTargetColorHex) {
                taskScore += 10;
                // Add a small success animation
                document.getElementById('color-word').style.transform = "scale(1.2)";
                setTimeout(() => document.getElementById('color-word').style.transform = "scale(1)", 200);
            } else {
                taskScore -= 5; // Penalty for wrong answer
                alert('Oops! आपको शब्द का "रंग" चुनना था, "शब्द" नहीं! 🤯');
            }
            updateScore();
            nextTaskRound();
        }

        function updateScore() {
            document.getElementById('task-score').innerText = `Score: ${taskScore}`;
        }

        // Initialize the first game on load
        window.onload = initMemoryGame;

    </script>
</body>
</html>
